<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우표 폰트 10종 미리보기</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Gowun+Dodum&family=Hi+Melody&family=Yeon+Sung&family=Nanum+Pen+Script&family=Jua&family=Dokdo&family=Gamja+Flower&family=Gaegu&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fdfcf9;
            font-family: sans-serif;
            padding: 40px;
            color: #2a241f;
        }
        h1 { text-align: center; margin-bottom: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            text-align: center;
        }
        .card-header {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 16px;
        }
        .preview-text {
            font-size: 3rem;
            color: #2a241f;
            line-height: 1.2;
        }
        /* Fonts */
        .f-gowun-dodum { font-family: 'Gowun Dodum', sans-serif; }
        .f-gowun-batang { font-family: 'Gowun Batang', serif; }
        .f-nanum-pen { font-family: 'Nanum Pen Script', cursive; font-size: 3.5rem; }
        .f-yeon-sung { font-family: 'Yeon Sung', cursive; }
        .f-dokdo { font-family: 'Dokdo', cursive; font-size: 3.5rem; }
        .f-hi-melody { font-family: 'Hi Melody', cursive; }
        .f-gaegu { font-family: 'Gaegu', cursive; }
        .f-gamja { font-family: 'Gamja Flower', cursive; }
        .f-poor-story { font-family: 'Poor Story', cursive; }
        .f-jua { font-family: 'Jua', sans-serif; }
    </style>
</head>
<body>
    <h1>우표 장소 이름 폰트 10종 미리보기</h1>
    <div class="grid">
        <div class="card"><div class="card-header">1. 고운돋움 (Gowun Dodum)</div><div class="preview-text f-gowun-dodum">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">2. 고운바탕 (Gowun Batang)</div><div class="preview-text f-gowun-batang">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">3. 나눔펜스크립트 (Nanum Pen)</div><div class="preview-text f-nanum-pen">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">4. 연성 (Yeon Sung)</div><div class="preview-text f-yeon-sung">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">5. 독도 (Dokdo)</div><div class="preview-text f-dokdo">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">6. 하이멜로디 (Hi Melody)</div><div class="preview-text f-hi-melody">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">7. 개구 (Gaegu)</div><div class="preview-text f-gaegu">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">8. 감자꽃 (Gamja Flower)</div><div class="preview-text f-gamja">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">9. 푸어스토리 (Poor Story)</div><div class="preview-text f-poor-story">두무진<br>백령도</div></div>
        <div class="card"><div class="card-header">10. 주아 (Jua)</div><div class="preview-text f-jua">두무진<br>백령도</div></div>
    </div>
</body>
</html>
